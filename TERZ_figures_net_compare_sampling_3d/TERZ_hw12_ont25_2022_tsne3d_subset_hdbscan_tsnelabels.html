    "3c13c0123a5f48d48651f3adfbbfc186": {
      "model_name": "TemplateModel",
      "model_module": "jupyter-vue",
      "model_module_version": "3.1.1",
      "state": {
        "_model_module": "jupyter-vue",
        "_model_module_version": "3.1.1",
        "_model_name": "TemplateModel",
        "_view_count": null,
        "_view_module": null,
        "_view_module_version": "",
        "_view_name": null,
        "esm_export": null,
        "esm_module": null,
        "source_url": "legend.vue",
